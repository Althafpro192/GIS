version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: gis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tefa2025bisa
      MYSQL_DATABASE: jember_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    ports:
      - "3306:3306"
    networks:
      - gis-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptefa2025bisa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gis-backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html/backend:ro
      - ./index.php:/var/www/html/index.php:ro
    environment:
      - PHP_FPM_PM_MAX_CHILDREN=10
      - PHP_FPM_PM_START_SERVERS=2
      - PHP_FPM_PM_MIN_SPARE_SERVERS=1
      - PHP_FPM_PM_MAX_SPARE_SERVERS=5
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gis-network
    expose:
      - "9000"

  # Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gis-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html/backend:ro
    depends_on:
      - backend
    networks:
      - gis-network

networks:
  gis-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
